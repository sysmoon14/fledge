name: Site

# The homepage (site/, assembled by utils/build-site.sh), published to GitHub
# Pages when it or what it shows changes on main, or by hand.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/screens/**
      - assets/icon/fledge.svg
      - utils/build-site.sh
      - utils/build-docs.py
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble
        run: sh utils/build-site.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
