name: An idea
description: Something you'd like the thermostat or the app to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you want to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Thermostat generation and heating system, if it matters for this.
