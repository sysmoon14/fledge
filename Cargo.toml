[workspace]
resolver = "2"
members = ["crates/fledge-core", "crates/fledge-host", "crates/fledge-cli", "crates/fledge-gui", "crates/nestlocal"]

[workspace.package]
edition = "2021"

[profile.release]
lto = true
strip = true
codegen-units = 1

# nestlocal and the Thread bridge for the thermostat: size first, as a gen 2's
# root slot has little room for them (opt-level s keeps most of 3's speed for
# Matter's crypto, at three quarters of the size).
[profile.thermostat]
inherits = "release"
opt-level = "s"

# What draws the home screen cards on the thermostat, for speed: a card is
# drawn while the ring waits, on one slow core.
[profile.thermostat.package.tiny-skia]
opt-level = 3

[profile.thermostat.package.tiny-skia-path]
opt-level = 3

[profile.thermostat.package.ab_glyph_rasterizer]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
