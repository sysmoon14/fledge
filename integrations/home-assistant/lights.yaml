blueprint:
  name: Nest lights (unfr0zen)
  description: >-
    Puts lights on a Nest thermostat running unfr0zen: Settings → UNFR0ZEN →
    Lights lists them. Pressing an on/off light toggles it; a dimmable one
    opens a page where turning the ring sets its brightness and pressing
    toggles it. Change the lights here at any time, with no new build for
    the thermostat. Up to 6 lights, in the order chosen.
  domain: automation
  source_url: https://github.com/unfr0zen/unfr0zen/blob/main/integrations/home-assistant/lights.yaml
  input:
    thermostat:
      name: Thermostat
      description: The Nest thermostat running unfr0zen's nestlocal, with MQTT.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Google Nest
    lights:
      name: Lights
      description: >-
        Shown on the thermostat in this order, by their names here. Lights
        that support brightness are dimmable with the ring.
      selector:
        entity:
          multiple: true
          filter:
            - domain:
                - light
                - switch
                - input_boolean

# nestlocal keeps the list retained on nestlocal/<serial>/set/lights and
# shows each light's state from it, so it is published again whenever a
# light changes. The thermostat asks for changes on
# nestlocal/<serial>/lights/command: {"id": ..., "on": ..., "brightness": ...}
# (brightness in percent, missing for on at the light's last). Only the
# lights chosen here can be switched from it.
mode: queued
max: 20
triggers:
  - trigger: state
    entity_id: !input lights
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: mqtt
    topic: nestlocal/+/lights/command
    id: command
variables:
  thermostat: !input thermostat
  lights: !input lights
  serial: "{{ device_attr(thermostat, 'serial_number') }}"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: command
          - condition: template
            value_template: >-
              {{ trigger.topic.split('/')[1] == serial
                 and trigger.payload_json is mapping
                 and trigger.payload_json.get('id') in lights }}
        sequence:
          - variables:
              entity: "{{ trigger.payload_json.id }}"
              turn_on: "{{ trigger.payload_json.get('on', false) | bool(false) }}"
              brightness: "{{ trigger.payload_json.get('brightness', 0) | int(0) }}"
          - choose:
              - conditions: "{{ not turn_on }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ entity }}"
              - conditions: "{{ entity.startswith('light.') and 1 <= brightness <= 100 }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ entity }}"
                    data:
                      brightness_pct: "{{ brightness }}"
            default:
              - action: homeassistant.turn_on
                target:
                  entity_id: "{{ entity }}"
    default:
      # The list, with each light's state. A light dims when it supports
      # any colour mode beyond on/off; brightness is in percent, 1 at least
      # while it is on.
      - action: mqtt.publish
        data:
          topic: "nestlocal/{{ serial }}/set/lights"
          retain: true
          payload: >-
            {%- set ns = namespace(items=[]) -%}
            {%- for entity in lights[:6] -%}
              {%- set modes = state_attr(entity, 'supported_color_modes') or [] -%}
              {%- set level = state_attr(entity, 'brightness') -%}
              {%- set ns.items = ns.items + [{
                    'id': entity,
                    'name': state_attr(entity, 'friendly_name') or entity,
                    'on': is_state(entity, 'on'),
                    'dimmable': entity.startswith('light.')
                                and modes | reject('in', ['onoff', 'unknown']) | list | count > 0,
                    'brightness': [(level * 100 / 255) | round(0) | int, 1] | max
                                  if level is number and is_state(entity, 'on') else none
                  }] -%}
            {%- endfor -%}
            {{ ns.items | to_json }}
